<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canalizar-te - Central Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1021; color: #f1f5f0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: #151c33; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        h1 { text-align: center; color: #38b2f6; margin-bottom: 15px; font-size: 26px; font-weight: 800; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 600; color: #cbd5e1; font-size: 16px; }
        select, textarea, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f1f5f0; font-size: 16px; }
        button { width: 100%; margin-top: 20px; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #1d4ed8; }
        .card { background: #1e1e2f; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Canalizar-te</h1>
        <p class="subtitle">Gestor de Projetos e Esboço de Hidráulica</p>

        <!-- Secção 1: Configuração Inicial -->
        <label for="material-tipo">🛠️ Tipo de Rede / Material:</label>
        <select id="material-tipo">
            <option value="PPR">PP-R (Água Quente / Fria)</option>
            <option value="PVC">PVC (Esgoto / Drenagem)</option>
            <option value="PEAD">PEAD (Adução / Exterior)</option>
        </select>

        <!-- Secção 2: Esboço Tátil do Projeto de Canalização -->
        <div class="card">
            <h3 style="color: #4da6ff; margin-bottom: 10px;">📐 2. Esboço do Projeto Hidráulico</h3>
            <p style="color: #ccc; font-size: 0.9rem; margin-bottom: 10px;">Usa o dedo para desenhar a rede de tubagem:</p>
            
            <canvas id="meuCanvas" width="350" height="220" style="border: 2px dashed #4da6ff; background: #fff; width: 100%; border-radius: 6px; touch-action: none;"></canvas>
            
            <button onclick="limparCanvas()" style="background-color: #d9534f; margin-top: 10px;">Limpar Desenho</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('meuCanvas');
        const ctx = canvas.getContext('2d');
        let desenhando = false;

        // Suporte a Telemóvel (Toque)
        canvas.addEventListener('touchstart', iniciarDesenho, { passive: false });
        canvas.addEventListener('touchmove', desenhar, { passive: false });
        canvas.addEventListener('touchend', pararDesenho);

        // Suporte a Computador (Rato)
        canvas.addEventListener('mousedown', iniciarDesenho);
        canvas.addEventListener('mousemove', desenhar);
        canvas.addEventListener('mouseup', pararDesenho);

        function obterPosicao(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function iniciarDesenho(e) {
            e.preventDefault();
            desenhando = true;
            const pos = obterPosicao(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function desenhar(e) {
            if (!desenhando) return;
            e.preventDefault();
            const pos = obterPosicao(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = '#0056b3';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function pararDesenho() {
            desenhando = false;
        }

        function limparCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
